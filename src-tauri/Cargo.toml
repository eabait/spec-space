[package]
name = "spec-space"
version = "0.1.0"
description = "Local Markdown specification workspace"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "spec_space_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
